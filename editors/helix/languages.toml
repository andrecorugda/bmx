# Helix: append to ~/.config/helix/languages.toml
#
# Diagnostics come from `bmx-lsp`, a Burxt binary you build once. It needs no runtime at all —
# it used to need node, and porting the server removed that requirement from every editor.

[language-server.bmx-lsp]
command = "/path/to/bmx-lsp"

[[language]]
name = "bmx"
scope = "text.bmx"
file-types = ["bmx"]
comment-token = "<!--"
language-servers = ["bmx-lsp"]
indent = { tab-width = 2, unit = "  " }
soft-wrap = { enable = true }
