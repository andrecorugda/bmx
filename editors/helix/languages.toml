# Helix: append to ~/.config/helix/languages.toml
#
# Diagnostics come from `bmx-lsp`, which needs node and nothing else.

[language-server.bmx-lsp]
command = "node"
args = ["/path/to/bmx/editors/lsp/bmx-lsp.mjs"]

[[language]]
name = "bmx"
scope = "text.bmx"
file-types = ["bmx"]
comment-token = "<!--"
language-servers = ["bmx-lsp"]
indent = { tab-width = 2, unit = "  " }
soft-wrap = { enable = true }
