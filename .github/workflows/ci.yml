# BMX's own CI, separate from any host's.
#
# It runs two things, and the second is the one that would catch a specification bug:
#
#   1. the reference implementation against the conformance suite — does it match what we wrote;
#   2. the reference implementation against ITSELF via `agree.py` over a corpus, which is a
#      no-op today with one implementation and becomes the real test the moment there are two.
#
# There is deliberately NO Burxt here. The format must be testable without its first host
# installed, or "standalone" is a word rather than a property.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The reference implementation passes the suite
        run: python3 tests/harness.py "node reference/bmx.js"

      # A suite that finds no cases passes silently, which is the shape of every ratchet failure
      # worth having a name for.
      - name: The suite is not empty
        run: |
          count=$(ls tests/cases/*.bmx tests/errors/*.bmx | wc -l)
          echo "$count documents"
          test "$count" -ge 39

      # A page that documents `{{` is a page Jekyll reads as Liquid, so every doc wraps its body
      # in {% raw %}. An UNCLOSED one is worse than a missing one: the missing case fails on the
      # brace it could not parse, the unclosed case fails on the tag and takes the whole site with
      # it. That happened -- a slice to end-of-file removed the closing tag from two pages and the
      # build died with "'raw' tag was never closed".
      #
      # Checked here rather than trusted, because there is no Ruby on the machine these pages are
      # written on: Jekyll only ever runs on the remote, so a green local anything says nothing
      # about whether the site builds.
      - name: Every doc page closes its raw tag
        run: |
          bad=0
          for f in docs/*.md docs/guide/*.md; do
            o=$(grep -c '{% raw %}' "$f" || true)
            c=$(grep -c '{% endraw %}' "$f" || true)
            if [ "$o" != "$c" ]; then echo "::error file=$f::raw=$o endraw=$c"; bad=1; fi
          done
          test "$bad" -eq 0

      # VERSIONING.md: a case that had to be EDITED rather than ADDED is a major version.
      # This does not fail the build — it prints the fact so a reviewer sees it on the PR.
      - name: Report whether this touched an existing case
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          changed=$(git diff --diff-filter=M --name-only origin/${{ github.base_ref }} -- tests/ || true)
          if [ -n "$changed" ]; then
            echo "::warning::an existing conformance case was MODIFIED — VERSIONING.md makes this a MAJOR:"
            echo "$changed"
          else
            echo "no existing case modified; additions only"
          fi
