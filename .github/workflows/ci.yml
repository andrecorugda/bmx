# BMX's own CI, separate from any host's.
#
# It runs two things, and the second is the one that would catch a specification bug:
#
#   1. the reference implementation against the conformance suite — does it match what we wrote;
#   2. the reference implementation against ITSELF via `agree.py` over a corpus, which is a
#      no-op today with one implementation and becomes the real test the moment there are two.
#
# There is deliberately NO Burxt here. The format must be testable without its first host
# installed, or "standalone" is a word rather than a property.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      # **`@v5` because `@v4` runs on Node 20, which GitHub has deprecated.** Today's runs are forced
      # onto Node 24 with a warning; the warning becomes a failure when the shim is dropped, on
      # somebody else's schedule. Raised deliberately, in its own commit, the way the `BURXT` pin is.
      #
      # **v5 rather than the newest, which is v7.** v5, v6 and v7 all target node24, so the whole
      # deprecation is cleared by the smallest step — and each further major carries changes nobody here
      # has read. Two things v5 actually changes, both checked rather than assumed: `checkout` requires
      # runner v2.327.1 or newer, which GitHub-hosted runners are long past; and `setup-node` turns
      # caching on automatically when `package.json` declares a `packageManager`. This repository has no
      # root `package.json` at all, so that cannot fire — and it is switched off explicitly anyway,
      # because *cannot fire today* is a property of the tree rather than of the workflow.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: The reference implementation passes the suite
        run: python3 tests/harness.py "node reference/bmx.js"

      # A suite that finds no cases passes silently, which is the shape of every ratchet failure
      # worth having a name for.
      # **The check that found 0.8, kept rather than thrown away.** It indents every document that
      # parses and asserts the structure did not move — which sees a rule that is too BROAD, and the
      # conformance suite cannot, because every case in it was written by someone who believed the
      # rules. `--prove-it` is its negative control and runs in the same step: a check nobody has
      # watched fail is a check nobody has tested.
      # **A message is the compiler talking, so one instructing something illegal is worse than one
      # that says nothing** — you do as told, get a second refusal, and the two tools contradict each
      # other. star-burxt shipped four of exactly that today. This reads every message site out of BOTH
      # implementations rather than triggering the refusals, because a check that fires only the ones
      # somebody remembered is the shape that let theirs through.
      - name: No refusal tells an author to write what the format refuses
        run: |
          python3 tests/messages.py
          python3 tests/messages.py --prove-it

      - name: Indenting a document does not change it
        run: |
          python3 tests/roundtrip.py "node reference/bmx.js"
          python3 tests/roundtrip.py "node reference/bmx.js" --prove-it

      - name: The suite is not empty
        run: |
          count=$(ls tests/cases/*.bmx tests/errors/*.bmx | wc -l)
          echo "$count documents"
          test "$count" -ge 39

      # **A broken regex in a TextMate grammar does not fail** — the rule silently never matches,
      # the file still loads, and highlighting is quietly wrong. So the grammar is tokenised with
      # the real engine and its scopes are asserted, including the two that would be lies: a slot
      # inside a code fence or a code span is not a slot.
      #
      # `meta.slot.expression.bmx` and the other two injection scopes are asserted BY NAME, because
      # they are what a host's grammar injects into — renaming one breaks every host silently, and
      # their editors go quiet rather than erroring.
      - name: The grammar puts every scope where it says it does
        run: |
          npm install --silent vscode-textmate vscode-oniguruma
          node editors/vscode/test/scopes.mjs

      # **The site and the editor must colour a character the same way.** `docs/assets/code.js`
      # paints code blocks on the site and the grammar paints them in an editor — two programs, and
      # nothing but this stops them drifting, at which point a reader learns one set of colours from
      # the documentation and meets another the moment they open a file.
      #
      # It runs over the documentation's OWN snippets, because the divergence that matters is one a
      # reader can see. It found five real bugs on its first run.
      # **A gutter with unnumbered lines in it is worse than no gutter.** star-burxt built this first and
      # wrapped one of its painter's three exits, so the numbers stopped partway down the panel. This
      # asserts one box per line and that stripping the markup returns the document — the second is what
      # keeps a panel from being a trap for anyone who copies out of it.
      - name: Every line is numbered and the document survives painting
        run: |
          node editors/vscode/test/panel.mjs
          node editors/vscode/test/panel.mjs --prove-it

      - name: The site's colours and the editor's agree
        run: node editors/vscode/test/agrees.mjs

      # **A lint that fires on correct code is worse than no lint**, because the fix is to switch the
      # linter off and then no rule runs. So half of these cases are negatives, and the negatives came
      # from a consumer rather than from imagination — star-burxt reported BMX-W002 warning on void
      # elements, whose bodies must be empty by contract.
      - name: The linter fires where it should and stays quiet where it should
        run: node tests/lints.mjs

      # **`README.md` promised "any language can implement BMX" and `docs/` never named the harness.**
      # The suite takes an arbitrary command, so a stranger genuinely can conform in an afternoon — and
      # the only place that was written down was this repository, which a reader of the site never opens.
      # `install.md` then sent them to Building on BMX, which says in its first line that it is for
      # layers ABOVE the format. The reader 1.0 depends on met the wrong page and stopped.
      #
      # A page carrying a command is a claim, so the command is run. It deliberately does NOT pin the
      # pass count: a gate that fires when somebody adds a conformance case argues against the thing
      # this project wants to be frictionless.
      - name: The invitation on the site is a command that works
        run: |
          python3 tests/invitation.py
          python3 tests/invitation.py --prove-it

      # **`reference/bmx.js` could not be imported in a browser at all, and nothing here could see it.**
      # The CLI guard was a bare `process.argv[1]`, evaluated when the MODULE is evaluated, so a browser
      # threw `ReferenceError: process is not defined` before one export was reachable. Measured in real
      # headless Chrome by the star-burxt session, building a playground that renders BMX client-side —
      # they had assumed it worked because the conformance suite passes.
      #
      # **The suite is Node, run from this repository's own root, and so was every other exercise this
      # file has ever had.** `tests/portability.py` is named for this and asks the narrower question: which
      # Node *syntax* floor the file needs. A parser offered to strangers to copy is portable when it RUNS
      # where they put it, not when its syntax is old enough to — so that check could have stayed green
      # forever on a file no browser could load.
      - name: The parser imports where there is no Node
        run: |
          node tests/embeds.mjs
          node tests/embeds.mjs --prove-it

      # **Andre's rule for all three projects: if it can be written in Burxt, it must be, and reaching
      # for another language is a gap report rather than a solution.** BMX is the furthest of the three
      # from it by raw count and has the strongest defence — most of this job is Python and Node *because*
      # of the sentence at the top of this file, that the format must be testable without its first host
      # installed. A count without reasons reads worse than the truth, so every non-Burxt file states one
      # and this fails on a file that states none.
      #
      # It caps nothing. The `gap` total is printed, because a threshold is a number somebody raises when
      # it is inconvenient, and the rule is not "keep it under N" — it is "know what it is".
      - name: Every file that is not Burxt says why it is not
        run: |
          python3 tests/languages.py
          python3 tests/languages.py --prove-it

      # **Every failure mode of a language server is a silence.** A wrong Content-Length, a frame
      # split across two chunks, a request answered with nothing — the editor does not error, it just
      # stops showing diagnostics, and the author concludes the extension is broken. So the framing is
      # exercised deliberately, including the split-frame case that only appears under load.
      #
      # Two assertions in there are the ones everybody gets wrong: LSP positions are ZERO-based, and
      # the column counts characters. Both were confirmed by breaking them and watching the test fail.
      # `language-configuration.json` had nothing testing it for four releases, and its folding markers
      # and onEnter rule were keyed on 0.6's `:{3,}` — so folding a block silently stopped working when
      # the fence was respelled. The grammar, the server and the preview all had tests; the file that
      # decides how the editor BEHAVES did not.
      - name: The editor behaves the way the format reads
        run: node editors/vscode/test/config.mjs

      - name: The language server says what it should, in the right coordinates
        run: node editors/lsp/test/protocol.mjs

      # **The failure modes of a preview all look fine in a diff**: a command under the wrong id, a
      # panel that renders once and never again, an error path that shows a blank page instead of the
      # reason. VS Code cannot be scripted here; extension.js can, against a stub `vscode`.
      #
      # The blank-page case is the one that matters — a preview showing nothing where a slot had no
      # binding would have quietly done the thing BMX exists to refuse.
      - name: The preview does what the button promises
        run: |
          mkdir -p editors/vscode/reference
          cp reference/bmx.js editors/vscode/reference/bmx.mjs
          node editors/vscode/test/preview.js

      # **There is deliberately no separate "does it package" step.** The obvious shape is `pack.py`
      # then inspect the result, and it overwrites the evidence one line before looking for it — so a
      # stale committed `.vsix` passes forever. `tests/extension.py` packs once, compares, restores, and
      # asserts the archive's entries from the bytes it already has. **One thing packs.** star-burxt's CI
      # says the same in one line, `runs the test, not the packer`, and reached it independently.

      # A page that documents `{{` is a page Jekyll reads as Liquid, so every doc wraps its body
      # in {% raw %}. An UNCLOSED one is worse than a missing one: the missing case fails on the
      # brace it could not parse, the unclosed case fails on the tag and takes the whole site with
      # it. That happened -- a slice to end-of-file removed the closing tag from two pages and the
      # build died with "'raw' tag was never closed".
      #
      # Checked here rather than trusted, because there is no Ruby on the machine these pages are
      # written on: Jekyll only ever runs on the remote, so a green local anything says nothing
      # about whether the site builds.
      # **Indentation is insignificant, so nothing else can catch a wrong one.** The examples on the
      # site are what a reader copies, and a wrongly-indented example teaches the wrong shape while
      # parsing perfectly. `tools/fmt.py` decides the shape; this asserts the docs are in it.
      - name: Every example is indented the way the format says
        run: python3 tools/fmt.py --check docs/*.md docs/guide/*.md README.md editors/vscode/README.md

      # **A zero-dependency parser whose runtime requirement is undocumented is not portable — it is
      # untested on everything except the machine that wrote it.** `reference/bmx.js` is what this project
      # offers a stranger to copy, and nothing said which Node runs it. CI provides 20, which is a PIN;
      # the floor is 14, measured (nullish coalescing is the newest thing in the file).
      #
      # The check reads the floor out of `docs/install.md` so the number lives in one place, and it exists
      # because measuring it went wrong first: `\.at\(` matched `...at(source, offset)` — a spread of a
      # local function — and reported a floor 2.6 versions too high, which I nearly published.
      - name: The reference parser needs nothing newer than the Node it promises
        run: |
          python3 tests/portability.py
          python3 tests/portability.py --prove-it

      # **Three status claims were stale at once, one of them nine releases behind** — and a stale
      # NOT-DONE is found by nobody, because a reader who is told a feature is absent believes it and
      # leaves. The version lives in `SPEC.md`'s title; this checks every page against it.
      - name: Every version the documentation states agrees with SPEC.md
        run: |
          python3 tests/version.py
          python3 tests/version.py --prove-it

      - name: Every doc page closes its raw tag
        run: |
          bad=0
          for f in docs/*.md docs/guide/*.md; do
            o=$(grep -c '{% raw %}' "$f" || true)
            c=$(grep -c '{% endraw %}' "$f" || true)
            if [ "$o" != "$c" ]; then echo "::error file=$f::raw=$o endraw=$c"; bad=1; fi
          done
          test "$bad" -eq 0

      # VERSIONING.md: a case that had to be EDITED rather than ADDED is a major version.
      # This does not fail the build — it prints the fact so a reviewer sees it on the PR.
      - name: Report whether this touched an existing case
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          changed=$(git diff --diff-filter=M --name-only origin/${{ github.base_ref }} -- tests/ || true)
          if [ -n "$changed" ]; then
            echo "::warning::an existing conformance case was MODIFIED — VERSIONING.md makes this a MAJOR:"
            echo "$changed"
          else
            echo "no existing case modified; additions only"
          fi

  # **A SEPARATE JOB, and that is what keeps the sentence at the top of this file true.**
  #
  # `conformance` above needs Node and nothing else. That is the standalone property, and it is
  # unchanged: the format is still testable without its first host installed, and this job could be
  # deleted tomorrow without weakening a single claim BMX makes about itself.
  #
  # What this job tests is one HOST'S implementation, which now lives here because a format repo is
  # where implementations belong — `reference/bmx.js` has been here since the first commit for the
  # same reason. The difference is that `reference/` is a role and `burxt/` is an audience:
  # `bmx.js` exists to define what the format does, `bmx.bx` exists to be used by Burxt programs.
  #
  # **It installs a RELEASED Burxt and never builds `develop`, and that is the boundary rather than
  # a convenience.** A package that builds its compiler from a moving branch has no reproducible
  # build — `burxt.lock` pins dependency commits precisely so a build is a fact, and building the
  # compiler from a branch undoes that one layer down. It also consumes unreleased features
  # silently: `std/` was depended on for hours before it shipped and nobody could see it.
  #
  # The tempting counter-argument is that building `develop` would catch Burxt regressions early.
  # That is a trap. It makes this badge go red for reasons that are not BMX's, and **a badge that
  # goes red for somebody else's reasons is one people learn to ignore.** Catching Burxt
  # regressions is Burxt's suite's job.
  #
  # BURXT is the version BMX supports. Raise it deliberately, in its own commit, with the suite
  # green against it — never as a side effect of something else.
  burxt-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the Burxt this release of BMX supports
        env:
          # Raised 1.4.0 -> 1.5.0 on 2026-08-20, deliberately and alone, with the suite green against the
          # PUBLISHED asset rather than a local build of the tag: 29 checks, including the Burxt half.
          # 1.5.0 ships `std/zip.bx` and `std/deflate.bx`, which this repository does not use and will not
          # — `editors/vscode/pack.py` is reachable from the conformance job, and that job may not need a
          # Burxt toolchain (see the top of this file). The pin is what BMX tests against; the FLOOR is
          # 1.3.0 and is stated in `docs/install.md`, which is a different number and must not follow this
          # one.
          BURXT: 1.5.0
        run: |
          set -eux
          base="https://github.com/andrecorugda/burxt/releases/download/v$BURXT"
          asset="burxt-$BURXT-linux-x86_64.tar.gz"
          curl -fsSL -o "/tmp/$asset" "$base/$asset"

          # **The digest, because a version string does not identify a binary.** This step downloaded and
          # unpacked whatever the URL served and never checked what it got. Measured locally on the day
          # this was added: for one tag there were THREE different byte streams — an installed compiler,
          # a tarball in the language repository's `dist/`, and the published asset — and
          # `burxt --version` prints the same `burxt 1.4.0` for all of them. A local build of the same tag
          # is what turned star-burxt's `main` red while every local suite was green.
          #
          # So the pin is a digest as well as a number. If a future release ships no `SHA256SUMS`, this
          # fails loudly, which is the correct outcome: an unverifiable toolchain is not one to pin to.
          curl -fsSL -o /tmp/SHA256SUMS "$base/SHA256SUMS"
          (cd /tmp && grep " $asset\$" SHA256SUMS | sha256sum -c -)

          mkdir -p /tmp/burxt && tar xzf "/tmp/$asset" -C /tmp/burxt --strip-components=1
          sudo install -d /usr/local/bin /usr/local/lib/burxt
          sudo install -m 755 /tmp/burxt/burxt /usr/local/bin/burxt
          sudo install -m 644 /tmp/burxt/lib/*.bx /usr/local/lib/burxt/
          # `burxt --version` prints the banner and exits 2, so under `set -e` it kills the step
          # even though the install worked. Piped so the exit status is `head`'s: this line is here
          # to put the version in the log, not to be a test. Reported to Burxt.
          burxt --version 2>&1 | head -1

      # **The formatting claim, tested at last.** `SPEC.md` and every example on the site are indented by
      # `tools/fmt.py`, which is checked — but `burxt/bmx.bx` is Burxt source and nothing checked its
      # indentation until `burxt fmt --check` shipped in 1.4.0. It was NOT formatted: 477 lines differed,
      # every one of them purely leading or trailing whitespace, and one was a real defect — an `if` nested
      # inside an `else` sat at the `else`'s own indentation, so the file read as though the branch were a
      # sibling of the branch containing it.
      #
      # **A formatter is the one tool that finds what a reviewer's eye slides over**, which is the same
      # reason `tools/fmt.py` exists for the documents. Requested from the Burxt session when it was still
      # on their `develop`; verified against the released tarball rather than the branch.
      #
      # **After the install, and that is not incidental** — I wrote this step above it first, referring to a
      # toolchain that would not exist for another thirty lines and to a path CI does not use. A step whose
      # dependency runs later fails in a way that reads like the tool being broken.
      - name: The Burxt implementation is formatted
        run: |
          burxt fmt --check burxt/bmx.bx burxt/conformance.bx burxt/guarantees.bx

      # **The rule across these three projects: if it can be written in Burxt, it must be, and reaching
      # for another language is a gap report rather than a solution.** `harness.py` was never the gap —
      # it takes an arbitrary command, so a stranger implementing BMX in a sixth language can check their
      # work without this toolchain, and that neutrality is the format's central claim. It is untouched.
      #
      # The gap was that **the implementation Burxt users actually get was verified only by a program in
      # another language.** This drives `burxt/bmx.bx` over the same fixtures in Burxt. Two runners, one
      # question, opposite sides: if they disagree, one has a bug and the fixtures decide.
      #
      # Built rather than `burxt run`, because `burxt run` cannot pass a program an argument — anything
      # after the file is a LINK argument, which is how `parse.bx`'s documented invocation turned out to
      # have never worked.
      - name: The suite runs on Burxt, over the Burxt implementation
        run: |
          burxt build burxt/conformance.bx -o /tmp/bmx-conformance
          /tmp/bmx-conformance

      - name: The Burxt implementation passes the format's own suite
        run: |
          set -eux
          burxt build burxt/examples/parse.bx -o /tmp/bmx-parse
          python3 tests/harness.py /tmp/bmx-parse

      # **Level 1 is "renders", not "parses".** Two implementations can agree on every AST in the
      # corpus and still disagree about the page — a different heading tag, a different escape set,
      # a link scheme one allows. This compares the PAGES.
      #
      # It exists because the claim came before the code: README listed the reference implementation
      # as level 1 while it exported only `parse`. It found the two disagreeing about the shape of a
      # render error on its first run, and that was Burxt's file speaking two error formats.
      - name: The two renderers produce the same page
        run: |
          burxt build tools/render.bx -o /tmp/bmxrender
          python3 tests/renders.py /tmp/bmxrender

      # The question the suite cannot ask: do two implementations reach the same answer where
      # nothing was written down? That is where a specification's ambiguities live, and it is how
      # the one in SPEC.md §4a.2 was found.
      # **The third thing `ESCAPING.md` requires, which nothing tested until 0.11.** `renders.py` treats
      # both renderers refusing as agreement, so if both stopped refusing `javascript:` it would still
      # pass. This asserts the outcome per renderer.
      - name: No document can reach the output through a target or an info string
        run: python3 tests/output.py "node reference/bmx.js --render" /tmp/bmxrender

      - name: The two implementations agree with each other
        run: python3 tests/agree.py 'node reference/bmx.js' /tmp/bmx-parse

      # **Level 2, which is the reason the format was worth defining.** `harness.py` above asks
      # whether this parser matches the spec; this asks whether a generated view carries the
      # guarantees the document could not — a missing field, a wrong type and re-rounded money are
      # all compile errors, and a `javascript:` target never reaches a page.
      #
      # It lived in Burxt's `tests/runner.rs` while `bmx.bx` lived in Burxt's `lib/`, and moved
      # here with the implementation rather than staying behind as a claim nobody runs.
      #
      # **And it is Burxt now, where it was `burxt/test.py`.** That file had no defence under the rule
      # that a thing writable in Burxt must be written in it: the argument protecting `harness.py` and
      # the other neutral runners — a stranger must be able to check a sixth implementation without this
      # toolchain — never reached it, because it *already required the toolchain* and only ever ran in
      # this job. It was Python because the files around it were. The port asserts the same thirteen
      # things under the same names, verified by running both and diffing; and it needed one capability
      # the fixture runner did not, `os_capture_status`, which keeps stdout and stderr apart so a
      # refusal asserted to START with `BMX-G001` cannot be prefixed by whatever the generator printed.
      - name: A document becomes a view the compiler checks
        run: burxt run burxt/guarantees.bx

      # A package is not usable because its own tests pass — star-burxt's suite was green through a
      # gap that made every symbol unreachable, because its only consumer lived inside the package.
      # So: a program OUTSIDE this repository, reaching BMX the way anyone else would.
      # **Six documented calls, five unreachable — and six public names in no documentation.** The
      # boundary is the PACKAGE, so no test inside this tree can see it: a non-`public` function called
      # from another FILE compiles happily. The step below tested one name, and it was the one that
      # worked. This builds a dependent package for every name, both directions.
      - name: Every documented name is reachable, and every public name is documented
        run: |
          python3 tests/surface.py
          python3 tests/surface.py --prove-it

      - name: Somebody else's program can reach `bmx_parse`
        run: |
          set -eux
          mkdir -p /tmp/consumer && cd /tmp/consumer
          printf 'name        consumer\nversion     0.1.0\ndependency  bmx  %s\n' "$GITHUB_WORKSPACE" > burxt.package
          printf '# Hi\n\nTotal: {{ order.total }}\n' > doc.bmx
          cat > main.bx <<'BX'
          use "bmx/burxt/bmx.bx";
          use "std/files.bx";

          match file_read_maybe("doc.bmx") {
              None => { print("no document"); }
              Some(source) => {
                  match bmx_parse(source) {
                      Error(message) => { print("refused: " + message); }
                      Ok(blocks) => { print("parsed " + to_string(len(blocks)) + " blocks"); }
                  }
              }
          }
          BX
          test "$(burxt run main.bx)" = "parsed 2 blocks"
