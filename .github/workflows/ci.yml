# BMX's own CI, separate from any host's.
#
# It runs two things, and the second is the one that would catch a specification bug:
#
#   1. the reference implementation against the conformance suite — does it match what we wrote;
#   2. the reference implementation against ITSELF via `agree.py` over a corpus, which is a
#      no-op today with one implementation and becomes the real test the moment there are two.
#
# There is deliberately NO Burxt here. The format must be testable without its first host
# installed, or "standalone" is a word rather than a property.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The reference implementation passes the suite
        run: python3 tests/harness.py "node reference/bmx.js"

      # A suite that finds no cases passes silently, which is the shape of every ratchet failure
      # worth having a name for.
      - name: The suite is not empty
        run: |
          count=$(ls tests/cases/*.bmx tests/errors/*.bmx | wc -l)
          echo "$count documents"
          test "$count" -ge 39

      # A page that documents `{{` is a page Jekyll reads as Liquid, so every doc wraps its body
      # in {% raw %}. An UNCLOSED one is worse than a missing one: the missing case fails on the
      # brace it could not parse, the unclosed case fails on the tag and takes the whole site with
      # it. That happened -- a slice to end-of-file removed the closing tag from two pages and the
      # build died with "'raw' tag was never closed".
      #
      # Checked here rather than trusted, because there is no Ruby on the machine these pages are
      # written on: Jekyll only ever runs on the remote, so a green local anything says nothing
      # about whether the site builds.
      - name: Every doc page closes its raw tag
        run: |
          bad=0
          for f in docs/*.md docs/guide/*.md; do
            o=$(grep -c '{% raw %}' "$f" || true)
            c=$(grep -c '{% endraw %}' "$f" || true)
            if [ "$o" != "$c" ]; then echo "::error file=$f::raw=$o endraw=$c"; bad=1; fi
          done
          test "$bad" -eq 0

      # VERSIONING.md: a case that had to be EDITED rather than ADDED is a major version.
      # This does not fail the build — it prints the fact so a reviewer sees it on the PR.
      - name: Report whether this touched an existing case
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          changed=$(git diff --diff-filter=M --name-only origin/${{ github.base_ref }} -- tests/ || true)
          if [ -n "$changed" ]; then
            echo "::warning::an existing conformance case was MODIFIED — VERSIONING.md makes this a MAJOR:"
            echo "$changed"
          else
            echo "no existing case modified; additions only"
          fi

  # **A SEPARATE JOB, and that is what keeps the sentence at the top of this file true.**
  #
  # `conformance` above needs Node and nothing else. That is the standalone property, and it is
  # unchanged: the format is still testable without its first host installed, and this job could be
  # deleted tomorrow without weakening a single claim BMX makes about itself.
  #
  # What this job tests is one HOST'S implementation, which now lives here because a format repo is
  # where implementations belong — `reference/bmx.js` has been here since the first commit for the
  # same reason. The difference is that `reference/` is a role and `burxt/` is an audience:
  # `bmx.js` exists to define what the format does, `bmx.bx` exists to be used by Burxt programs.
  #
  # **It builds Burxt from source rather than installing a release, and that is temporary but not
  # optional.** `use "std/…"` — how a package reaches the standard library — is unreleased. So no
  # published Burxt can compile this file, and pinning one would be pinning a compiler that cannot
  # build the thing it is pinned for. When Burxt ships `std/`, this becomes an install step and the
  # build disappears.
  burxt-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the compiler that can read `std/`
        run: |
          set -eux
          git clone --depth 1 --branch develop https://github.com/andrecorugda/burxt.git /tmp/burxt
          sudo apt-get update -qq && sudo apt-get install -y llvm-18-dev libpolly-18-dev
          cd /tmp/burxt && LLVM_SYS_181_PREFIX=/usr/lib/llvm-18 cargo build --release
          sudo install -d /usr/local/bin /usr/local/lib/burxt
          sudo install -m 755 target/release/burxt /usr/local/bin/burxt
          sudo install -m 644 lib/*.bx /usr/local/lib/burxt/

      - name: The Burxt implementation passes the format's own suite
        run: |
          set -eux
          burxt build burxt/examples/parse.bx -o /tmp/bmx-parse
          python3 tests/harness.py /tmp/bmx-parse

      # The question the suite cannot ask: do two implementations reach the same answer where
      # nothing was written down? That is where a specification's ambiguities live, and it is how
      # the one in SPEC.md §4a.2 was found.
      - name: The two implementations agree with each other
        run: python3 tests/agree.py 'node reference/bmx.js' /tmp/bmx-parse

      # A package is not usable because its own tests pass — star-burxt's suite was green through a
      # gap that made every symbol unreachable, because its only consumer lived inside the package.
      # So: a program OUTSIDE this repository, reaching BMX the way anyone else would.
      - name: Somebody else's program can reach `bmx_parse`
        run: |
          set -eux
          mkdir -p /tmp/consumer && cd /tmp/consumer
          printf 'name        consumer\nversion     0.1.0\ndependency  bmx  %s\n' "$GITHUB_WORKSPACE" > burxt.package
          printf '# Hi\n\nTotal: {{ order.total }}\n' > doc.bmx
          cat > main.bx <<'BX'
          use "bmx/burxt/bmx.bx";
          use "std/files.bx";

          match file_read_maybe("doc.bmx") {
              None => { print("no document"); }
              Some(source) => {
                  match bmx_parse(source) {
                      Error(message) => { print("refused: " + message); }
                      Ok(blocks) => { print("parsed " + to_string(len(blocks)) + " blocks"); }
                  }
              }
          }
          BX
          test "$(burxt run main.bx)" = "parsed 2 blocks"
