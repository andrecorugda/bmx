<!doctype html><html><head><meta charset="utf-8"><style>
 *{box-sizing:border-box} body{margin:0;background:#eef1f5;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif}
 .wrap{max-width:940px;margin:0 auto;padding:34px 30px}
 .pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
 .panel{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);overflow:hidden}
 .cap{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.09em;text-transform:uppercase;color:#6b7280;padding:12px 16px;border-bottom:1px solid #eceff3;background:#fafbfc}
 .render{padding:20px 22px}
 /* skin A — editorial */
 .a .bmx{font-family:Georgia,'Times New Roman',serif;color:#1a1a1a}
 .a .bmx h1{font-size:1.6rem;font-weight:normal;border-bottom:2px solid #E8502A;padding-bottom:.25em;margin:.1em 0 .6em}
 .a .bmx ul{list-style:none;padding-left:0}
 .a .bmx li{padding:.35em 0;border-bottom:1px dotted #d8dce1}
 /* skin B — compact product */
 .b .bmx{font-size:14px;color:#111827}
 .b .bmx h1{font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin:0 0 .8em}
 .b .bmx ul{list-style:none;padding-left:0;display:grid;gap:6px}
 .b .bmx li{background:#f6f8fa;border-radius:6px;padding:.5em .7em}
 .b .bmx strong{color:#E8502A}
</style></head><body><div class="wrap"><div class="pair">
<div class="panel a"><div class="cap">one stylesheet</div><div class="render"><article class="bmx"><h1>Receipt R-4417</h1><p>Thank you, <strong>Ada Lovelace</strong>. Your total is $59.97.</p><ul><li>Delivery: Thursday</li><li>Paid: 16 August</li></ul></article></div></div>
<div class="panel b"><div class="cap">another stylesheet</div><div class="render"><article class="bmx"><h1>Receipt R-4417</h1><p>Thank you, <strong>Ada Lovelace</strong>. Your total is $59.97.</p><ul><li>Delivery: Thursday</li><li>Paid: 16 August</li></ul></article></div></div>
</div></div></body></html>
