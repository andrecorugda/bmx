<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title == "BMX" %}BMX — Burxt Markup Language{% else %}{{ page.title }} · BMX{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root { --fg:#16181d; --bg:#fff; --muted:#5b6270; --line:#e3e6eb; --accent:#0b5fff; --code:#f5f6f8; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e8ec; --bg:#14161a; --muted:#9aa2b1; --line:#282c34; --accent:#7aa2ff; --code:#1c1f25; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
  nav { border-bottom:1px solid var(--line); margin-bottom:2.5rem; padding-bottom:1rem;
        display:flex; gap:1.25rem; flex-wrap:wrap; align-items:baseline; }
  nav .brand { font-weight:700; letter-spacing:-.02em; }
  nav a { color:var(--muted); text-decoration:none; }
  nav a:hover, nav a.here { color:var(--fg); }
  h1,h2,h3 { line-height:1.25; letter-spacing:-.02em; }
  h1 { font-size:2rem; margin-top:0; }
  h2 { margin-top:2.5rem; padding-top:.5rem; border-top:1px solid var(--line); }
  a { color:var(--accent); }
  code { background:var(--code); padding:.15em .35em; border-radius:3px; font-size:.9em; }
  pre { background:var(--code); padding:1rem; border-radius:6px; overflow-x:auto; }
  pre code { background:none; padding:0; font-size:.86rem; }
  table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; }
  th,td { border:1px solid var(--line); padding:.5rem .7rem; text-align:left; vertical-align:top; }
  blockquote { border-inline-start:3px solid var(--line); margin-inline:0; padding-inline-start:1rem; color:var(--muted); }
  footer { margin-top:4rem; padding-top:1rem; border-top:1px solid var(--line); color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <span class="brand">BMX</span>
  <a href="/"{% if page.title == "BMX" %} class="here"{% endif %}>Overview</a>
  <a href="/syntax.html"{% if page.title == "Writing a document" %} class="here"{% endif %}>Syntax</a>
  <a href="/rendering.html"{% if page.title == "Turning it into a page" %} class="here"{% endif %}>Rendering</a>
  <a href="/styling.html"{% if page.title == "Styling the output" %} class="here"{% endif %}>Styling</a>
  <a href="/errors.html"{% if page.title == "When it refuses" %} class="here"{% endif %}>Errors</a>
  <a href="https://github.com/andrecorugda/bmx">GitHub</a>
</nav>
{{ content }}
<footer>
  BMX 0.1 · a format of the <a href="https://burxt-lang.org">Burxt</a> project · MIT OR Apache-2.0
</footer>
</div>
</body>
</html>
